name: opencode-scheduled

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Работа по расписанию:
            - Изучи TODO.md и код репозитория.
            - Удали из TODO.md уже выполненные пункты.
            - Исправь мелкие баги и очевидные проблемы: закоммить и открой PR.
            - Для крупных задач создай issues.
            - Следуй AGENTS.md (Conventional Commits, правила проекта).