[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-booking-backend"
version = "0.1.0"
description = "Calendar Booking backend (FastAPI), compatible with spec/api.tsp"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]